services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/db/dev.db"
      CHROMA_URL: "http://chroma:8000"
    ports:
      - "${DOCKER_RAG_WEB_PORT:-3108}:3000"
    volumes:
      - sqlite-data:/app/data/db
      - uploads:/app/data/uploads
    depends_on:
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    ports:
      - "${DOCKER_RAG_CHROMA_PORT:-8108}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    healthcheck:
      test: ["CMD", "chroma", "--version"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  sqlite-data:
  uploads:
  chroma-data:
